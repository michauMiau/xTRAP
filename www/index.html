<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>xTRAP</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --card: #161b22;
    --line: #2a3139;
    --text: #e8eaed;
    --dim: #8b949e;
    --accent: #f0a030;
    --accent-dim: #7a5216;
    --ok: #3fb950;
    --bad: #f85149;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: .04em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none;
         transition: background .2s; }
  .dot.on { background: var(--ok); }
  .batt { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--dim);
          font-variant-numeric: tabular-nums; font-size: 14px; }
  .batt .track { width: 34px; height: 10px; border: 1px solid var(--line); border-radius: 3px;
                 padding: 1px; }
  .batt .fill { display: block; height: 100%; width: 0; background: var(--accent);
                border-radius: 2px; transition: width .3s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 13px 14px 15px; margin-bottom: 11px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  label { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .val { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .val small { font-size: 14px; color: var(--dim); font-weight: 500; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; margin: 6px 0 2px;
    background: transparent; display: block;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) 0 var(--fill, 50%), #2a3139 var(--fill, 50%) 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: -10px;
    border-radius: 50%; background: var(--text);
    border: 3px solid var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #2a3139; }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--text); border: 3px solid var(--accent);
  }
  .scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px;
           font-variant-numeric: tabular-nums; margin-top: -2px; }
  .btns { display: flex; gap: 8px; margin-top: 9px; }
  button {
    flex: 1; padding: 11px 8px; font: inherit; font-size: 14px; color: var(--text);
    background: #21262d; border: 1px solid var(--line); border-radius: 10px;
  }
  button:active { background: #2d333b; border-color: #3d444d; }
  button.wide { width: 100%; flex: none; }
  button.accent { background: var(--accent-dim); border-color: #96691f; color: #ffd9a0; }
  button.danger { border-color: #5a2a26; color: #ffb3ad; }
  .status { margin-top: 2px; color: var(--dim); font-size: 12.5px;
            font-variant-numeric: tabular-nums; text-align: center; }
  .status b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>xTRAP</h1>
  <span class="batt"><span id="batt">--</span><span class="track"><span class="fill" id="battFill"></span></span></span>
</header>

<div class="card">
  <div class="row"><label for="steer">Skręt</label><span class="val"><span id="steerVal">90</span><small>°</small></span></div>
  <input type="range" id="steer" min="0" max="180" step="1" value="90">
  <div class="scale"><span>0</span><span>90</span><span>180</span></div>
  <div class="btns">
    <button id="left" type="button">◀ 10°</button>
    <button id="center" type="button">Centruj</button>
    <button id="right" type="button">10° ▶</button>
  </div>
</div>

<div class="card">
  <div class="row"><label for="throttle">Gaz</label><span class="val"><span id="throttleVal">0</span><small>%</small></span></div>
  <input type="range" id="throttle" min="-100" max="100" step="5" value="0">
  <div class="scale"><span>-100</span><span>0</span><span>100</span></div>
  <div class="btns">
    <button id="stop" type="button" class="danger wide">Stop</button>
  </div>
</div>

<button id="release" type="button" class="accent wide">Puść serwa</button>

<div class="status"><span id="conn">łączenie…</span> · <b id="last">—</b></div>

<script>
const $ = (id) => document.getElementById(id);
const steer = $('steer'), throttle = $('throttle');
const steerVal = $('steerVal'), throttleVal = $('throttleVal');
const dot = $('dot'), conn = $('conn'), last = $('last');
const batt = $('batt'), battFill = $('battFill');

let ws = null;
let lastSent = 0;

function paint(input) {
  const min = +input.min, max = +input.max, v = +input.value;
  input.style.setProperty('--fill', ((v - min) / (max - min) * 100) + '%');
}

function send(text) {
  if (ws && ws.readyState === 1) {
    ws.send(text);
    last.textContent = text;
  }
}

function push(input, fmt, cmd) {
  const v = +input.value;
  fmt.textContent = v;
  paint(input);
  const now = Date.now();
  if (now - lastSent < 40) return;
  lastSent = now;
  send(cmd + v);
}

function setSteer(v) {
  steer.value = Math.max(0, Math.min(180, Math.round(v)));
  lastSent = 0;
  push(steer, steerVal, 'S,');
}

function setThrottle(v) {
  throttle.value = Math.max(-100, Math.min(100, Math.round(v)));
  lastSent = 0;
  push(throttle, throttleVal, 'T,');
}

steer.addEventListener('input', () => push(steer, steerVal, 'S,'));
throttle.addEventListener('input', () => push(throttle, throttleVal, 'T,'));
$('left').addEventListener('click', () => setSteer(+steer.value - 10));
$('right').addEventListener('click', () => setSteer(+steer.value + 10));
$('center').addEventListener('click', () => setSteer(90));
$('stop').addEventListener('click', () => setThrottle(0));
$('release').addEventListener('click', () => send('X'));

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft') setSteer(+steer.value - 10);
  else if (e.key === 'ArrowRight') setSteer(+steer.value + 10);
  else if (e.key === 'ArrowUp') setThrottle(+throttle.value + 20);
  else if (e.key === 'ArrowDown') setThrottle(+throttle.value - 20);
  else if (e.key === ' ') { e.preventDefault(); send('X'); }
});

function connect() {
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => {
    dot.className = 'dot on';
    conn.textContent = 'połączono';
  };
  ws.onclose = () => {
    dot.className = 'dot';
    conn.textContent = 'rozłączono, ponawiam…';
    setTimeout(connect, 1000);
  };
  ws.onmessage = (ev) => {
    if (ev.data.startsWith('B,')) {
      const pct = ev.data.slice(2);
      batt.textContent = pct + '%';
      battFill.style.width = pct + '%';
    }
  };
}

paint(steer);
paint(throttle);
connect();
</script>
</body>
</html>
